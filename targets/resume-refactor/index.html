<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Refactor</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    label { display: block; font-weight: 600; margin-bottom: .25rem; }
    textarea { width: 100%; min-height: 280px; box-sizing: border-box; font: inherit; }
    button { margin: 1rem 0; padding: .6rem 1.2rem; font-size: 1rem; }
    #error { color: #b00020; }
    #result { white-space: pre-wrap; border: 1px solid #ccc; padding: 1rem; min-height: 4rem; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Resume Refactor</h1>
  <p>Paste your resume and a job description. The model rewrites the resume for that job.</p>
  <div class="grid">
    <div>
      <label for="resume">Resume</label>
      <textarea id="resume" placeholder="Paste your resume"></textarea>
    </div>
    <div>
      <label for="vacancy">Job description</label>
      <textarea id="vacancy" placeholder="Paste the job description"></textarea>
    </div>
  </div>
  <button id="refactor" type="button">Refactor</button>
  <p id="status" role="status" aria-live="polite"></p>
  <p id="error" role="alert"></p>
  <h2>Result</h2>
  <div id="result" aria-live="polite"></div>
  <button id="copy" type="button" hidden>Copy result</button>

  <script>
    const $ = (id) => document.getElementById(id);

    $('refactor').addEventListener('click', async () => {
      $('error').textContent = '';
      $('result').textContent = '';
      $('copy').hidden = true;
      const resume = $('resume').value.trim();
      const vacancy = $('vacancy').value.trim();
      if (!resume || !vacancy) {
        $('error').textContent = !resume ? 'Please paste your resume.' : 'Please paste the job description.';
        return;
      }
      $('refactor').disabled = true;
      $('status').textContent = 'Refactoring...';
      try {
        const res = await fetch('/api/refactor', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ resume, vacancy }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error ?? `Request failed (${res.status})`);
        $('result').textContent = data.result;
        $('copy').hidden = false;
      } catch (e) {
        $('error').textContent = e.message;
      } finally {
        $('status').textContent = '';
        $('refactor').disabled = false;
      }
    });

    $('copy').addEventListener('click', async () => {
      await navigator.clipboard.writeText($('result').textContent);
      $('copy').textContent = 'Copied';
    });
  </script>
</body>
</html>
