name: CI (nightly + main)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
      # Docker's default /dev/shm is 64MB, too small for Chromium/Firefox/WebKit
      # running in parallel — causes renderer crashes mid-run. --ipc=host is
      # Playwright's documented fix for containerized CI.
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy target page to surge.sh
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: npm run deploy:target

      - name: Run Playwright tests
        env:
          # Firefox refuses to launch when $HOME isn't owned by the current
          # user. The GitHub Actions runner forces HOME=/github/home for
          # container jobs regardless of container/job-level env, so this
          # has to be overridden at the step level to take effect.
          HOME: /root
        run: npx playwright test

      - name: Get previous Allure history
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report (with history)
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_history: allure-history
          keep_reports: 40

      - name: Publish Allure dashboard to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Upload raw Allure results (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 14
